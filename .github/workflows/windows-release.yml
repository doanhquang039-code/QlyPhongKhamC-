name: Windows application package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained Windows package
        shell: pwsh
        run: .\publish.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: QlyPhongKham-win-x64
          path: artifacts/QlyPhongKham-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts/QlyPhongKham-win-x64.zip" --generate-notes
